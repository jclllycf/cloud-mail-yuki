<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yuki Mail — fictional product showcase</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#37332f;background:#f7f4ef;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100vh}.frame{min-height:100vh;display:grid;grid-template-columns:248px 1fr;background:#f8f6f2}.side{background:#f0ece5;border-right:1px solid #e2ddd4;padding:30px 18px;display:flex;flex-direction:column}.brand{display:flex;gap:12px;align-items:center;margin:0 8px 34px}.mark{height:36px;width:36px;border:1px solid #ddcbb9;border-radius:10px;color:#92543e;display:grid;place-items:center}.mark svg{width:19px}.brand strong{font-size:18px}.brand small{display:block;font-size:10px;letter-spacing:1.5px;color:#897d71;margin-top:3px}.account{display:flex;align-items:center;gap:10px;padding:12px 4px;border-block:1px solid #e4ded5;margin-bottom:23px}.avatar{height:34px;width:34px;display:grid;place-items:center;border-radius:50%;background:#e4d9c9;color:#6c5143;font-weight:600;font-size:12px;flex:none}.account b,.account small{display:block}.account b{font-size:12px}.account small{font-size:10px;color:#827970;margin-top:4px}.switch{margin-left:auto;color:#94877b}.scope{display:flex;padding:4px;background:#e8e2d9;border-radius:6px;margin-bottom:16px}.scope span{flex:1;padding:9px;text-align:center;border-radius:4px;color:#746b62;font-size:12px}.scope .active{background:#fffdfa;color:#633d2d;font-weight:600;box-shadow:0 1px 2px #47301a12}.nav{display:grid;gap:4px}.nav div{height:42px;display:flex;align-items:center;gap:12px;padding:0 12px;border-radius:5px;font-size:13px;color:#625c56}.nav .current{background:#e7d9cb;color:#653f30;font-weight:600}.ico{width:18px;height:18px;display:grid;place-items:center}.ico svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round}.quiet{margin-top:auto;padding:18px 10px 0;color:#83796e;font-size:11px}.main{min-width:0;padding:32px 40px 42px}.top{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:24px}.title h1{margin:0 0 5px;font-size:25px;letter-spacing:-.6px;font-weight:620}.title p{margin:0;color:#81796f;font-size:12px}.actions{display:flex;gap:8px;align-items:center}.button{border:1px solid #e0d9d0;background:#fffdfa;color:#554c43;border-radius:5px;padding:9px 13px;font-size:12px}.button.primary{background:#92543e;color:white;border-color:#92543e;font-weight:600;padding:10px 15px}.tools{display:flex;align-items:center;gap:10px;border-block:1px solid #e8e2d9;padding:12px 0;margin-bottom:4px}.search{height:36px;border:1px solid #e4ded5;background:#fffdfa;border-radius:5px;display:flex;align-items:center;gap:9px;padding:0 11px;color:#8b8279;font-size:12px;flex:1;max-width:420px}.tools .button{padding:8px 10px}.demo{font-size:9px;letter-spacing:.45px;text-transform:uppercase;color:#8a5f4a;background:#efe4da;padding:6px 8px;border-radius:3px;margin-left:auto}.list{background:#fffdfa;border-bottom:1px solid #e8e2d9}.row{min-height:86px;display:grid;grid-template-columns:36px minmax(125px,190px) minmax(200px,1fr) auto;gap:12px;align-items:center;padding:12px 12px;border-bottom:1px solid #eee9e2}.row:last-child{border-bottom:0}.row .avatar{height:34px;width:34px}.row .sage{background:#e2e8df;color:#566752}.row .clay{background:#eddfd5;color:#89583e}.row .lavender{background:#e8e2eb;color:#6d6073}.row .sand{background:#ece5d8;color:#786548}.sender{font-size:12px;font-weight:650}.address{font-size:10px;color:#958b80;margin-top:4px}.subject{font-size:13px;font-weight:590;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.preview{font-size:11px;color:#81796f;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.time{font-size:10px;color:#857c72;align-self:start;padding-top:7px}.unread-dot{display:inline-block;width:6px;height:6px;background:#92543e;border-radius:50%;margin-right:7px;vertical-align:1px}.read .subject,.read .sender{font-weight:450}.read{background:#fffdfa}.footer{font-size:10px;color:#9b9187;padding:13px 12px}.reader{max-width:900px;margin:0 auto;background:#fffdfa;border:1px solid #e8e2d9;border-radius:7px;min-height:620px}.readerbar{display:flex;justify-content:space-between;padding:14px 22px;border-bottom:1px solid #eee9e2}.readbody{max-width:680px;padding:34px 48px}.readbody h2{font-size:24px;line-height:1.28;margin:0 0 21px;letter-spacing:-.4px}.meta{display:flex;gap:12px;align-items:center;padding-bottom:24px;border-bottom:1px solid #eee9e2}.meta .avatar{height:40px;width:40px}.meta strong{font-size:13px}.meta p{font-size:11px;color:#81796f;margin:4px 0 0}.bodycopy{font-family:Georgia,serif;font-size:16px;line-height:1.8;color:#49443f;padding:22px 0}.bodycopy p{margin:0 0 17px}.attachment{display:flex;align-items:center;gap:12px;border:1px solid #e9e3db;padding:13px;border-radius:5px;font-size:12px}.file{width:32px;height:36px;border-radius:4px;background:#f0e9df;display:grid;place-items:center;color:#895b44}.compose{max-width:880px;margin:20px auto;background:#fffdfa;border:1px solid #e5ddd3;border-radius:7px;box-shadow:0 12px 34px #4a302011;overflow:hidden}.compose-head{display:flex;justify-content:space-between;padding:16px 20px;border-bottom:1px solid #eee9e2;font-weight:600;font-size:14px}.field{display:flex;gap:15px;padding:13px 20px;border-bottom:1px solid #f0ebe5;font-size:12px;color:#857b71}.field label{width:42px}.field span{color:#504941}.editor{min-height:260px;padding:24px 78px;font-family:Georgia,serif;font-size:15px;line-height:1.8}.compose-actions{display:flex;gap:8px;padding:14px 20px;border-top:1px solid #eee9e2}.settings{max-width:880px}.settings h2{font-size:18px;margin:0 0 5px}.settings .intro{font-size:12px;color:#877e75;margin:0 0 23px}.settings-card{background:#fffdfa;border:1px solid #e6dfd6;border-radius:6px;margin-bottom:16px}.card-head{padding:16px 18px;border-bottom:1px solid #eee9e2;font-size:13px;font-weight:620}.choice{display:flex;align-items:center;gap:12px;padding:15px 18px;border-bottom:1px solid #f1ece6;font-size:12px}.choice:last-child{border:0}.swatch{height:16px;width:16px;border-radius:50%;border:1px solid #00000016}.check{margin-left:auto;color:#92543e;font-weight:700}.identity{padding:18px;display:flex;align-items:center;gap:12px}.identity .avatar{height:42px;width:42px}.identity p{font-size:12px;margin:0}.identity small{color:#867c72}.analytics{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:25px 0 20px}.metric{background:#fffdfa;border:1px solid #e7e0d7;border-radius:6px;padding:18px}.metric small{font-size:11px;color:#81776d}.metric strong{display:block;font-size:25px;margin-top:8px;font-weight:620}.metric em{font-style:normal;font-size:10px;color:#758568}.chartbox{background:#fffdfa;border:1px solid #e7e0d7;border-radius:6px;padding:20px}.chartbox h3{font-size:13px;margin:0}.chartbox p{font-size:11px;color:#82796f;margin:5px 0 22px}.bars{height:230px;display:flex;align-items:end;gap:12px;padding:8px 10px;border-bottom:1px solid #e8e2d9;background:repeating-linear-gradient(to bottom,transparent 0 55px,#f0ebe5 56px)}.bar{flex:1;background:#c39174;border-radius:4px 4px 0 0;min-width:12px;opacity:.86}.months{display:flex;justify-content:space-between;color:#8d8379;font-size:10px;margin-top:9px}.mobile{max-width:400px;min-height:840px;margin:-12px auto;background:#f8f6f2;border:9px solid #3a3632;border-radius:34px;overflow:hidden;box-shadow:0 20px 50px #34231622}.mobile .mhead{padding:30px 17px 14px;background:#f8f6f2}.mobile .mbrand{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}.mobile .mbrand strong{font-size:19px}.mobile .mhead h2{font-size:23px;margin:0 0 5px}.mobile .mhead p{margin:0;color:#80776d;font-size:11px}.mobile .mtools{display:flex;gap:8px;margin-top:14px}.mobile .mtools .search{height:34px}.mobile .mrow{display:grid;grid-template-columns:33px 1fr auto;gap:10px;align-items:start;padding:16px 14px;background:#fffdfa;border-top:1px solid #eee9e2}.mobile .mrow .avatar{width:32px;height:32px}.mobile .mrow strong{font-size:12px}.mobile .mrow p{margin:5px 0 0;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mobile .mrow small{display:block;color:#82796f;font-size:10px;line-height:1.5;margin-top:4px;max-width:250px}.mobile .mrow time{font-size:9px;color:#877d73}.mobile .fab{position:sticky;float:right;bottom:18px;margin:8px 16px;background:#92543e;color:white;border-radius:50%;width:48px;height:48px;display:grid;place-items:center;box-shadow:0 5px 14px #512b1c38}.screen-title{font-size:10px;color:#988c80;margin-bottom:10px}.letter{font-family:Georgia,serif;color:#92543e;font-size:14px}.hide{display:none!important}
@media(max-width:900px){.frame{grid-template-columns:205px 1fr}.main{padding:28px 24px}.row{grid-template-columns:34px 145px minmax(120px,1fr) auto}.address{display:none}}
</style></head>
<body><div id="app"></div>
<script>
const mail=[
{n:'Rowan Studio',a:'hello@rowan-studio.example',s:'A little color for the weekend',p:'We gathered a few quiet ideas for your reading corner...',t:'9:42 AM',tone:'sage',u:1},
{n:'The Sunday Letter',a:'letters@sunday-journal.example',s:'Your Sunday reading list',p:'Three thoughtful stories, one good recipe, and a place to begin.',t:'8:15 AM',tone:'clay',u:1},
{n:'Nora at Fieldnotes',a:'nora@fieldnotes.example',s:'Re: the little garden plan',p:'That sounds lovely. I’ll bring the seed packets along.',t:'Yesterday',tone:'lavender'},
{n:'Paper & Pine',a:'care@paper-pine.example',s:'Your order is on its way',p:'A small parcel of notebooks is making its way to you.',t:'Yesterday',tone:'sand'},
{n:'Avery Chen',a:'avery@studio-fern.example',s:'(no subject)',p:'Hi Mira, just checking whether Thursday afternoon still works...',t:'Tue',tone:'sage'}];
const icons={mail:'<path d="M3 6.5h18v12H3z"/><path d="m3.5 7 8.5 6 8.5-6"/>',inbox:'<path d="M4 4h16l2 11h-6l-2 3h-4l-2-3H2z"/><path d="M2.5 15H8l2 3h4l2-3h5.5"/>',send:'<path d="m21 3-7.5 18-3.7-7.8L2 9.5z"/><path d="M9.8 13.2 21 3"/>',draft:'<path d="M5 3h10l4 4v14H5z"/><path d="M14 3v5h5M8 13h8M8 17h6"/>',star:'<path d="m12 3 2.7 5.6 6.2.9-4.5 4.4 1.1 6.2-5.5-2.9-5.5 2.9 1.1-6.2-4.5-4.4 6.2-.9z"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="m19.4 15 .1.1 1.4 1.1-1.4 2.4-1.7-.7a8 8 0 0 1-1.7 1l-.3 1.8h-2.8l-.3-1.8a8 8 0 0 1-1.7-1l-1.7.7-1.4-2.4 1.4-1.1a7 7 0 0 1 0-2l-1.4-1.1 1.4-2.4 1.7.7a8 8 0 0 1 1.7-1l.3-1.8h2.8l.3 1.8a8 8 0 0 1 1.7 1l1.7-.7 1.4 2.4-1.4 1.1a7 7 0 0 1 0 2z"/>',chart:'<path d="M4 19V5M4 19h17M8 15l3-4 3 2 5-7"/>',search:'<circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/>',plus:'<path d="M12 5v14M5 12h14"'},
ico=n=>`<span class="ico"><svg viewBox="0 0 24 24">${icons[n]}</svg></span>`, avatar=(txt,tone)=>`<span class="avatar ${tone||''}">${txt}</span>`,row=m=>`<div class="row ${m.u?'':'read'}">${avatar(m.n.split(' ').map(x=>x[0]).slice(0,2).join(''),m.tone)}<div><div class="sender">${m.u?'<i class="unread-dot"></i>':''}${m.n}</div><div class="address">${m.a}</div></div><div><div class="subject">${m.s}</div><div class="preview">${m.p}</div></div><time class="time">${m.t}</time></div>`;
function shell(content,section='Inbox'){return `<div class="frame"><aside class="side"><div class="brand"><span class="mark">${ico('mail')}</span><div><strong>Yuki Mail</strong><small>YUKI</small></div></div><div class="account">${avatar('ML')}<div><b>Mira Lane</b><small>mira@willow.example</small></div><span class="switch">⌄</span></div><div class="scope"><span class="active">${ico('mail')} Mail</span><span>${ico('chart')} Manage</span></div><nav class="nav"><div class="current">${ico('inbox')} Inbox</div><div>${ico('send')} Sent</div><div>${ico('draft')} Drafts</div><div>${ico('star')} Starred</div></nav><div class="quiet">A quiet place for your letters.</div></aside><main class="main">${content}</main></div>`}
function inbox(){return shell(`<header class="top"><div class="title"><h1>Inbox</h1><p>mira@willow.example · 120 messages</p></div><div class="actions"><button class="button">↻ &nbsp;Refresh</button><button class="button primary">${ico('plus')} Write a letter</button></div></header><div class="tools"><div class="search">${ico('search')} Search your mail</div><button class="button">Newest first⌄</button><span class="demo">Fictional demo content</span></div><section class="list">${mail.map(row).join('')}<div class="footer">Showing 5 of 120 messages · Demo mailbox</div></section>`)}
function analytics(){let vals=[64,82,76,101,94,122,115,139,126,157,149,184];return shell(`<header class="top"><div class="title"><h1>Analytics</h1><p>A gentle overview of this demo workspace</p></div><span class="demo">Fictional demo statistics</span></header><div class="analytics"><div class="metric"><small>Messages received</small><strong>1,284</strong><em>↑ 8.4% this month</em></div><div class="metric"><small>Messages sent</small><strong>496</strong><em>↑ 3.1% this month</em></div><div class="metric"><small>Active addresses</small><strong>6</strong><em>Across 42 demo people</em></div></div><div class="chartbox"><h3>Mail, over a little time</h3><p>Fictional monthly message volume · last 12 months</p><div class="bars">${vals.map(v=>`<div class="bar" style="height:${v/2}px"></div>`).join('')}</div><div class="months"><span>May</span><span>Jun</span><span>Jul</span><span>Aug</span><span>Sep</span><span>Oct</span><span>Nov</span><span>Dec</span><span>Jan</span><span>Feb</span><span>Mar</span><span>Apr</span></div></div>`,'Manage')}
function reader(){return shell(`<div class="reader"><div class="readerbar"><button class="button">← &nbsp;Inbox</button><div class="actions"><button class="button">↶ Reply</button><button class="button">···</button></div></div><article class="readbody"><div class="screen-title">FICTIONAL MESSAGE</div><h2>A little color for the weekend</h2><div class="meta">${avatar('RS','sage')}<div><strong>Rowan Studio</strong><p>To Mira Lane · Today, 9:42 AM</p></div></div><div class="bodycopy"><p>Hi Mira,</p><p>We gathered a few quiet ideas for your reading corner. A softer lamp, a small stack of favorite books, and one little plant can make the whole space feel like yours.</p><p>Hope your weekend has a little room to breathe.</p><p>Warmly,<br>Rowan</p></div><div class="attachment"><span class="file">▧</span><div><strong>weekend-notes.pdf</strong><div class="address">PDF · 248 KB</div></div><button class="button" style="margin-left:auto">Download</button></div></article></div>`)}
function compose(){return shell(`<header class="top"><div class="title"><h1>Inbox</h1><p>mira@willow.example</p></div><span class="demo">Fictional compose preview</span></header><section class="compose"><div class="compose-head"><span>New letter</span><span style="color:#887e74">— &nbsp; □ &nbsp; ×</span></div><div class="field"><label>From</label><span>Mira Lane &lt;mira@willow.example&gt;</span></div><div class="field"><label>To</label><span>Alex Morgan &lt;alex@northwind.example&gt;</span></div><div class="field"><label>Subject</label><span>A small hello</span></div><div class="editor">Hi Alex,<br><br>I found a little place with lovely afternoon light and thought you might enjoy it too.<br><br>Would you like to meet there this week?<br><br>Warmly,<br>Mira</div><div class="compose-actions"><button class="button primary">Send letter</button><button class="button">Attach a file</button><span style="margin-left:auto;color:#8b8177;font-size:11px">Draft saved just now</span></div></section>`)}
function settings(){return shell(`<div class="settings"><header class="top"><div><h1 style="font-size:24px;margin:0">Settings</h1><p class="intro">A few details to make this place yours.</p></div><span class="demo">Fictional profile</span></header><section class="settings-card"><div class="card-head">Appearance</div><div class="choice"><span class="swatch" style="background:#92543e"></span><b>Clay Letter</b><small>Warm paper · default</small><span class="check">✓</span></div><div class="choice"><span class="swatch" style="background:#72836a"></span><b>Sage Garden</b><small>Natural and calm</small></div><div class="choice"><span class="swatch" style="background:#bd8060"></span><b>Cocoa Night</b><small>Warm dark theme</small></div></section><section class="settings-card"><div class="card-head">Your identity</div><div class="identity">${avatar('ML')}<p><b>Mira Lane</b><br><small>mira@willow.example</small></p><button class="button" style="margin-left:auto">Edit details</button></div></section></div>`)}
function mobile(){return `<div class="mobile"><div class="mhead"><div class="mbrand"><strong>Yuki Mail</strong><span>${ico('search')}　☰</span></div><h2>Inbox</h2><p>mira@willow.example · 120 messages</p><div class="mtools"><div class="search">${ico('search')} Search mail</div><button class="button">↻</button></div></div>${mail.map(m=>`<div class="mrow">${avatar(m.n.split(' ').map(x=>x[0]).slice(0,2).join(''),m.tone)}<div><strong>${m.n}</strong><p>${m.s}</p><small>${m.p}</small></div><time>${m.t}</time></div>`).join('')}<div class="fab">${ico('plus')}</div></div>`}
const key=new URLSearchParams(location.search).get('view')||'inbox';document.getElementById('app').innerHTML=({inbox,analytics,reader,compose,settings,mobile})[key]?.()||inbox();
</script></body></html>
