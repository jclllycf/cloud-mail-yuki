name: 🚀 Deploy cloud-mail to Cloudflare Workers

on:
  push:
    branches: [ main ]
    paths:
      - "mail-worker/**"
      - "mail-vue/**"
      - ".github/workflows/**"
  workflow_dispatch:

jobs:
  Deploy-cloud-mail:
    name: 🏗️ Build and Deploy
    runs-on: ubuntu-latest

    env:
      NAME: ${{ secrets.NAME || vars.NAME || 'cloud-mail-yuki' }}
      CUSTOM_DOMAIN: ${{ secrets.CUSTOM_DOMAIN || vars.CUSTOM_DOMAIN || 'mail.jcllyuki.com' }}
      DOMAIN: ${{ secrets.DOMAIN || vars.DOMAIN || '["jcllyuki.com"]' }}
      ADMIN: ${{ secrets.ADMIN || vars.ADMIN || 'admin@jcllyuki.com' }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID || vars.D1_DATABASE_ID }}
      KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID || vars.KV_NAMESPACE_ID }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME || vars.R2_BUCKET_NAME || 'cloud-mail-r2' }}
      PROJECT_LINK: ${{ secrets.PROJECT_LINK || vars.PROJECT_LINK }}
      AI_MODEL: ${{ secrets.AI_MODEL || vars.AI_MODEL || '@cf/meta/llama-3.1-8b-instruct-fast' }}
      CLOUDFLARE_EMAIL: ${{ secrets.CF_EMAIL || vars.CF_EMAIL || false }}
      ANALYSIS_CACHE: ${{ secrets.ANALYSIS_CACHE || vars.ANALYSIS_CACHE || false }}


    outputs:
      worker_url: ${{ steps.deploy.outputs.worker_url }}


    steps:
      - name: 🚚 检出代码仓库 / Checkout repository
        uses: actions/checkout@v4

      - name: ⚙ 设置 pnpm / Set up pnpm
        uses: pnpm/action-setup@v4.1.0
        with:
          version: 11

      - name: ⚙ 设置 Node.js / Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: "./mail-worker/pnpm-lock.yaml"

      - name: 📦 安装依赖 / Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./mail-worker

      - name: 📡 禁用 Wrangler 遥测 / Disable wrangler telemetry
        working-directory: ./mail-worker
        run: pnpm wrangler telemetry disable

      - name: 🛠️ 设置环境 / Set up environment
        working-directory: ./mail-worker
        run: |
          
          echo "🔐 Starting environment setup..."
          
          if [ -n "$JWT_SECRET" ]; then
            echo "::add-mask::$JWT_SECRET"
            if grep -q '[?%#/\\]' <<< "$JWT_SECRET"; then
              echo "❌ JWT_SECRET contains invalid characters (?, %, #, /, \\)."
              exit 1
            fi
          fi
          
          # 规范化 DOMAIN 格式，支持空值、单域名字符串及已有的 JSON 数组
          DOMAIN_INPUT="${DOMAIN:-[\"jcllyuki.com\"]}"
          DOMAIN_INPUT=$(echo "$DOMAIN_INPUT" | sed 's/\\"/"/g')
          if [[ "$DOMAIN_INPUT" != \[*\] ]]; then
            DOMAIN_INPUT="[\"$DOMAIN_INPUT\"]"
          fi
          
          if ! echo "$DOMAIN_INPUT" | jq -e 'type == "array"' >/dev/null 2>&1; then
            echo "❌ DOMAIN variable must be a JSON array (e.g. [\"jcllyuki.com\"]). Current value: $DOMAIN_INPUT"
            exit 1
          fi
          DOMAIN="$DOMAIN_INPUT"
          echo "🌐 Validated DOMAIN: $DOMAIN"
          
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "❌ CLOUDFLARE_ACCOUNT_ID is missing in GitHub repository settings!"
            echo "👉 Please go to: Settings -> Secrets and variables -> Actions, and add CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi
          
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "❌ CLOUDFLARE_API_TOKEN is missing in GitHub repository settings!"
            echo "👉 Please go to: Settings -> Secrets and variables -> Actions, and add CLOUDFLARE_API_TOKEN"
            exit 1
          fi
          
          if [ -z "$CUSTOM_DOMAIN" ]; then
            echo "::warning:: CUSTOM_DOMAIN variable is not set."
          fi
          
          CONFIG_FILE="wrangler-action.toml"
          
          if [ -z "$R2_BUCKET_NAME" ]; then
            sed -i '/\[\[r2_buckets\]\]/,/^$/d' "$CONFIG_FILE"
          fi
          
          if [ -z "$PROJECT_LINK" ]; then
            sed -i '/^project_link = /d' "$CONFIG_FILE"
          fi
          
          if [ -z "$CUSTOM_DOMAIN" ]; then
            sed -i '/\[\[routes\]\]/,/^$/d' "$CONFIG_FILE"
          fi
          
          if [ "$(printf '%s' "$CLOUDFLARE_EMAIL" | tr '[:upper:]' '[:lower:]')" = "true" ]; then
            cat >> "$CONFIG_FILE" <<'EOF'

          [[send_email]]
          name = "email"
          EOF
          fi

          sed -i "s|\${NAME}|${NAME}|g" "$CONFIG_FILE"
          sed -i "s|\${CUSTOM_DOMAIN}|${CUSTOM_DOMAIN}|g" "$CONFIG_FILE"
          sed -i "s|\"\${DOMAIN}\"|${DOMAIN}|g" "$CONFIG_FILE"
          if [ -n "$ADMIN" ]; then
            sed -i "s|\${ADMIN}|${ADMIN}|g" "$CONFIG_FILE"
          else
            sed -i '/^admin = /d' "$CONFIG_FILE"
          fi
          # NOTE: jwt_secret is managed securely as a Cloudflare Worker Secret, never in [vars]!
          sed -i "s|\${R2_BUCKET_NAME}|${R2_BUCKET_NAME}|g" "$CONFIG_FILE"
          sed -i "s|\${PROJECT_LINK}|${PROJECT_LINK}|g" "$CONFIG_FILE"
          sed -i "s|\${ANALYSIS_CACHE}|${ANALYSIS_CACHE}|g" "$CONFIG_FILE"
          sed -i "s|\${AI_MODEL}|${AI_MODEL}|g" "$CONFIG_FILE"
          sed -i "s|\${LINUXDO_CLIENT_ID}|${LINUXDO_CLIENT_ID}|g" "$CONFIG_FILE"
          sed -i "s|\${LINUXDO_CLIENT_SECRET}|${LINUXDO_CLIENT_SECRET}|g" "$CONFIG_FILE"
          sed -i "s|\${LINUXDO_CALLBACK_URL}|${LINUXDO_CALLBACK_URL}|g" "$CONFIG_FILE"
          
          echo "✅ Environment setup completed."

      - name: ⚡ 设置KV数据库 / Set up KV database
        working-directory: ./mail-worker
        run: |
          
          CONFIG_FILE="wrangler-action.toml"
          
          if [ -n "$KV_NAMESPACE_ID" ]; then
            sed -i "s|\${KV_NAMESPACE_ID}|${KV_NAMESPACE_ID}|g" "$CONFIG_FILE"
            echo "✅ Using the database from environment variables."
            exit 0
          fi
          
          echo "🔍 Checking if the database exists..."
          
          set +e
            KV_LIST=$(pnpm wrangler kv namespace list 2>&1)
            STATUS=$?
          set -e
          
          if [ $STATUS -ne 0 ]; then
            echo "$KV_LIST"
            exit 1
          fi
                  
          if echo "$KV_LIST" | jq -e ".[] | select(.title == \"$NAME\")" >/dev/null; then
            echo "✅ Database $NAME already exists."
            KV_ID=$(echo "$KV_LIST" | jq -r ".[] | select(.title == \"$NAME\") | .id")
            echo "KV_NAMESPACE_ID: $KV_ID"
          elif echo "$KV_LIST" | jq -e '.[] | select(.title == "cloud-mail")' >/dev/null; then
            echo "✅ Found existing KV database 'cloud-mail'."
            KV_ID=$(echo "$KV_LIST" | jq -r '.[] | select(.title == "cloud-mail") | .id')
            echo "KV_NAMESPACE_ID: $KV_ID"
          else
            echo "⚠️ Database $NAME does not exist. Starting creation..."
            pnpm wrangler kv namespace create $NAME
            KV_LIST=$(pnpm wrangler kv namespace list)
            KV_ID=$(echo "$KV_LIST" | jq -r ".[] | select(.title == \"$NAME\") | .id")
          fi
          
          sed -i "s|\${KV_NAMESPACE_ID}|$KV_ID|g" "$CONFIG_FILE"
          echo "✅ Setup completed."

      - name: 🐬 设置D1数据库 / Set up D1 database
        working-directory: ./mail-worker
        run: |
          
          CONFIG_FILE="wrangler-action.toml"
          
          if [ -n "$D1_DATABASE_ID" ]; then
            sed -i "s|\${D1_DATABASE_ID}|${D1_DATABASE_ID}|g" "$CONFIG_FILE"
            echo "✅ Using the database from environment variables."
            exit 0
          fi
          
          echo "🔍 Checking if the database exists..."
          
          set +e
            DB_LIST=$(pnpm wrangler d1 list --json 2>&1)
            STATUS=$?
          set -e
          
          if [ $STATUS -ne 0 ]; then
            echo "$DB_LIST"
            exit 1
          fi
          
          if echo "$DB_LIST" | jq -e ".[] | select(.name == \"$NAME\")" >/dev/null; then
            echo "✅ Database $NAME already exists."
            D1_NAME="$NAME"
            D1_ID=$(echo "$DB_LIST" | jq -r ".[] | select(.name == \"$NAME\") | .uuid")
            echo "D1_DATABASE_ID: $D1_ID"
          elif echo "$DB_LIST" | jq -e '.[] | select(.name == "cloud-mail")' >/dev/null; then
            echo "✅ Found existing D1 database 'cloud-mail'."
            D1_NAME="cloud-mail"
            D1_ID=$(echo "$DB_LIST" | jq -r '.[] | select(.name == "cloud-mail") | .uuid')
            echo "D1_DATABASE_ID: $D1_ID"
          else
            echo "⚠️ Database $NAME does not exist. Starting creation..."
            pnpm wrangler d1 create $NAME
            DB_LIST=$(pnpm wrangler d1 list --json)
            D1_NAME="$NAME"
            D1_ID=$(echo "$DB_LIST" | jq -r ".[] | select(.name == \"$NAME\") | .uuid")
          fi
          
          sed -i "s|database_name = \"cloud-mail\"|database_name = \"$D1_NAME\"|g" "$CONFIG_FILE"
          sed -i "s|\${D1_DATABASE_ID}|$D1_ID|g" "$CONFIG_FILE"
          echo "✅ Setup completed."

      - name: 🚀 开始部署 / Start deployment
        id: deploy
        working-directory: ./mail-worker
        run: |
          echo "🚀 Starting deployment..."
          pnpm wrangler deploy -c wrangler-action.toml 2>&1 \
            | tee deploy.log \
            | grep -v "https://.*\.workers\.dev" \
            | sed -E 's/env\.domain .*/env.domain (***)/' \
            || true
          
          DEPLOY_EXIT_CODE=${PIPESTATUS[0]}
          if [ $DEPLOY_EXIT_CODE -ne 0 ]; then
            exit 1
          fi
          
          WORKER_URL=$(grep -o "https://.*\.workers\.dev" deploy.log || echo "")
          
          if [ -n "$WORKER_URL" ]; then
            echo "::add-mask::$WORKER_URL"
          fi
          
          echo "worker_url=$WORKER_URL" >> $GITHUB_OUTPUT
          echo "✅ Setup completed."

      - name: 🔐 同步 Worker Secret / Sync Worker Secret
        if: env.JWT_SECRET != ''
        working-directory: ./mail-worker
        run: |
          echo "::add-mask::$JWT_SECRET"
          echo "Checking existing Worker secrets on Cloudflare..."
          set +e
          SECRETS_LIST=$(pnpm wrangler secret list --name "$NAME" -c wrangler-action.toml 2>&1)
          HAS_SECRET=$(echo "$SECRETS_LIST" | jq -r '.[] | select(.name == "jwt_secret") | .name' 2>/dev/null)
          set -e

          if [ "$HAS_SECRET" = "jwt_secret" ]; then
            echo "✅ Worker secret 'jwt_secret' already exists on Cloudflare. Preserving existing secret."
          else
            echo "ℹ️ Worker secret 'jwt_secret' not found. Creating..."
            set +e
            PUT_OUTPUT=$(echo "$JWT_SECRET" | pnpm wrangler secret put jwt_secret --name "$NAME" -c wrangler-action.toml 2>&1)
            PUT_STATUS=$?
            set -e

            if [ $PUT_STATUS -eq 0 ]; then
              echo "✅ Worker Secret 'jwt_secret' created successfully."
            elif echo "$PUT_OUTPUT" | grep -qi "already in use"; then
              echo "✅ Worker secret 'jwt_secret' already in use on Cloudflare. Preserving existing binding."
            else
              echo "$PUT_OUTPUT"
              exit $PUT_STATUS
            fi
          fi

      - name: ♻️ 初始化数据库 / Initialize database
        if: env.JWT_SECRET != ''
        run: |
          echo "🛠️ Starting database initialization..."
          echo "::add-mask::$JWT_SECRET"
          sleep 15
          
          WORKER_URL="${CUSTOM_DOMAIN:+https://$CUSTOM_DOMAIN}"
          WORKER_URL="${WORKER_URL:-${{ steps.deploy.outputs.worker_url }}}"
          
          if [ -z "$WORKER_URL" ]; then
            echo "::warning:: Preview URL not available. Skipping remote /api/init."
            exit 0
          fi
          
          HTTP_CODE=$(curl -sL -w "%{http_code}" -o response.txt "$WORKER_URL/api/init/${JWT_SECRET}")
          RESPONSE_BODY=$(cat response.txt)

          if [ "$RESPONSE_BODY" = "success" ]; then
            echo "✅ Setup completed."
          else
            echo "::warning:: Init response: HTTP: $HTTP_CODE, Response: $RESPONSE_BODY"
          fi

      - name: 🗑️ 删除运行记录 / Delete workflow runs
        uses: GitRML/delete-workflow-runs@main
        continue-on-error: true
        with:
          retain_days: '1'
          keep_minimum_runs: '0'
