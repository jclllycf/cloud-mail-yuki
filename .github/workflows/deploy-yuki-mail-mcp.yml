name: Deploy Yuki Mail Remote MCP

on:
  push:
    branches: [ main, feat/yuki-mail-remote-mcp ]
    paths:
      - "packages/mcp-remote-worker/**"
      - ".github/workflows/deploy-yuki-mail-mcp.yml"
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy read-only MCP
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID || vars.D1_DATABASE_ID }}
      KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID || vars.KV_NAMESPACE_ID }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME || vars.R2_BUCKET_NAME || 'cloud-mail-r2' }}
      MCP_MAILBOX: ${{ secrets.ADMIN || vars.ADMIN || 'admin@jcllyuki.com' }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "packages/mcp-remote-worker/package-lock.json"

      - name: Validate core deployment values
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID" && exit 1)
          test -n "$R2_BUCKET_NAME" || (echo "Missing R2_BUCKET_NAME" && exit 1)
          test -n "$MCP_MAILBOX" || (echo "Missing MCP_MAILBOX" && exit 1)
          test -n "$JWT_SECRET" || (echo "Missing JWT_SECRET" && exit 1)
          echo "::add-mask::$JWT_SECRET"

      - name: Install dependencies
        working-directory: packages/mcp-remote-worker
        run: npm ci --legacy-peer-deps

      - name: Resolve existing Cloud Mail bindings
        working-directory: packages/mcp-remote-worker
        shell: bash
        run: |
          set -euo pipefail

          D1_NAME="cloud-mail"

          if [ -z "${D1_DATABASE_ID:-}" ]; then
            D1_JSON="$(npx wrangler d1 list --json)"
            D1_DATABASE_ID="$(echo "$D1_JSON" | jq -r '
              map(select(.name == "cloud-mail-yuki" or .name == "cloud-mail"))
              | .[0].uuid // empty
            ')"
            D1_NAME="$(echo "$D1_JSON" | jq -r '
              map(select(.name == "cloud-mail-yuki" or .name == "cloud-mail"))
              | .[0].name // empty
            ')"
          else
            D1_JSON="$(npx wrangler d1 list --json)"
            MATCHED_NAME="$(echo "$D1_JSON" | jq -r --arg id "$D1_DATABASE_ID" '
              map(select(.uuid == $id)) | .[0].name // empty
            ')"
            if [ -n "$MATCHED_NAME" ]; then
              D1_NAME="$MATCHED_NAME"
            fi
          fi

          if [ -z "$D1_DATABASE_ID" ]; then
            echo "Could not resolve existing Cloud Mail D1 database"
            exit 1
          fi

          if [ -z "${KV_NAMESPACE_ID:-}" ]; then
            KV_JSON="$(npx wrangler kv namespace list)"
            KV_NAMESPACE_ID="$(echo "$KV_JSON" | jq -r '
              map(select(.title == "cloud-mail-yuki" or .title == "cloud-mail"))
              | .[0].id // empty
            ')"
          fi

          if [ -z "$KV_NAMESPACE_ID" ]; then
            echo "Could not resolve existing Cloud Mail KV namespace"
            exit 1
          fi

          echo "D1_DATABASE_ID=$D1_DATABASE_ID" >> "$GITHUB_ENV"
          echo "D1_DATABASE_NAME=$D1_NAME" >> "$GITHUB_ENV"
          echo "KV_NAMESPACE_ID=$KV_NAMESPACE_ID" >> "$GITHUB_ENV"

      - name: Typecheck
        working-directory: packages/mcp-remote-worker
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run build

      - name: Render isolated Wrangler config
        working-directory: packages/mcp-remote-worker
        shell: bash
        run: |
          set -euo pipefail
          cp wrangler.toml wrangler-action.toml
          sed -i "s|database_name = \"cloud-mail\"|database_name = \"$D1_DATABASE_NAME\"|g" wrangler-action.toml
          sed -i "s|\${D1_DATABASE_ID}|$D1_DATABASE_ID|g" wrangler-action.toml
          sed -i "s|\${KV_NAMESPACE_ID}|$KV_NAMESPACE_ID|g" wrangler-action.toml
          sed -i "s|\${R2_BUCKET_NAME}|$R2_BUCKET_NAME|g" wrangler-action.toml
          sed -i "s|\${MCP_MAILBOX}|$MCP_MAILBOX|g" wrangler-action.toml

      - name: Deploy Remote MCP worker
        working-directory: packages/mcp-remote-worker
        run: npx wrangler deploy --config wrangler-action.toml

      - name: Configure OAuth signing secret
        working-directory: packages/mcp-remote-worker
        shell: bash
        run: |
          set -euo pipefail
          OAUTH_SIGNING_SECRET="$(printf '%s' "$JWT_SECRET|yuki-mail-mcp-oauth-v1" | sha256sum | awk '{print $1}')"
          echo "::add-mask::$OAUTH_SIGNING_SECRET"
          printf '%s' "$OAUTH_SIGNING_SECRET" | npx wrangler secret put OAUTH_SIGNING_SECRET --name yuki-mail-mcp --config wrangler-action.toml

      - name: Smoke test public OAuth metadata
        shell: bash
        run: |
          set -euo pipefail
          sleep 8
          curl --fail --silent --show-error https://mcp.jcllyuki.com/health | jq -e '.ok == true and .mode == "readonly"'
          curl --fail --silent --show-error https://mcp.jcllyuki.com/.well-known/oauth-protected-resource | jq -e '.resource == "https://mcp.jcllyuki.com"'
          curl --fail --silent --show-error https://mcp.jcllyuki.com/.well-known/oauth-authorization-server | jq -e '.issuer == "https://mcp.jcllyuki.com"'
          STATUS="$(curl --silent --output /dev/null --write-out '%{http_code}' https://mcp.jcllyuki.com/mcp)"
          test "$STATUS" = "401" || (echo "Expected unauthenticated /mcp to return 401, got $STATUS" && exit 1)
